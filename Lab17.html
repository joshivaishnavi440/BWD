
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Registration System</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h2 {
    text-align: center;
    color: #333;
    margin-bottom: 22px;
}

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
}

.tabs button {
    flex: 1;
    padding: 11px 5px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    background: #eee;
    color: #333;
    font-size: 14px;
}

.tabs button.active {
    background: #667eea;
    color: white;
}

.form {
    display: none;
}

.form.active {
    display: block;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
    outline: none;
}

input:focus {
    border-color: #667eea;
}

.submit-btn, .logout-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 7px;
    background: #667eea;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 14px;
}

.submit-btn:hover {
    background: #5265c7;
}

.logout-btn {
    background: #e74c3c;
    margin-top: 20px;
}

.link {
    display: block;
    text-align: center;
    margin: 12px 0;
    color: #667eea;
    cursor: pointer;
    font-size: 14px;
    text-decoration: underline;
}

.message {
    text-align: center;
    font-size: 14px;
    margin-bottom: 12px;
    overflow-wrap: anywhere;
}

.success {
    color: #16803c;
}

.error {
    color: #d93025;
}

.welcome {
    text-align: center;
    padding: 20px 0;
}

.welcome p {
    margin-top: 12px;
    color: #555;
}
</style>
</head>

<body>

<div class="container">

    <h2 id="pageTitle">Welcome Back!</h2>

    <div class="tabs" id="tabs">
        <button class="active" id="loginTab"
                onclick="showPage('login')">Login</button>

        <button id="registerTab"
                onclick="showPage('register')">Register</button>
    </div>

    <p id="message" class="message" aria-live="polite"></p>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="form active">
        <input type="email" id="loginEmail"
               placeholder="Email Address" required>

        <input type="password" id="loginPassword"
               placeholder="Password" required>

        <button type="submit" class="submit-btn">Login</button>

        <span class="link" onclick="showPage('forgot')">
            Forgot Password?
        </span>

        <span class="link" onclick="showPage('register')">
            Don't have an account? Register
        </span>
    </form>

    <!-- REGISTRATION FORM -->
    <form id="registerForm" class="form">
        <input type="text" id="regName"
               placeholder="Full Name" required>

        <input type="email" id="regEmail"
               placeholder="Email Address" required>

        <input type="password" id="regPassword"
               placeholder="Create Password" minlength="6" required>

        <input type="password" id="confirmPassword"
               placeholder="Confirm Password" minlength="6" required>

        <button type="submit" class="submit-btn">
            Create Account
        </button>

        <span class="link" onclick="showPage('login')">
            Already have an account? Login
        </span>
    </form>

    <!-- FORGOT PASSWORD FORM -->
    <form id="forgotForm" class="form">
        <p style="margin-bottom:15px; color:#555;">
            Enter your registered email to reset your demo password.
        </p>

        <input type="email" id="forgotEmail"
               placeholder="Registered Email" required>

        <button type="submit" class="submit-btn">
            Continue
        </button>

        <span class="link" onclick="showPage('login')">
            Back to Login
        </span>
    </form>

    <!-- RESET PASSWORD FORM -->
    <form id="resetForm" class="form">
        <input type="password" id="newPassword"
               placeholder="New Password" minlength="6" required>

        <input type="password" id="confirmNewPassword"
               placeholder="Confirm New Password" minlength="6" required>

        <button type="submit" class="submit-btn">
            Reset Password
        </button>

        <span class="link" onclick="showPage('login')">
            Back to Login
        </span>
    </form>

    <!-- DASHBOARD AFTER LOGIN -->
    <div id="dashboard" class="form">
        <div class="welcome">
            <h2>Login Successful!</h2>
            <p id="welcomeText"></p>
            <p>You are now logged in.</p>
        </div>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>
    </div>

</div>

<script>
    const forms = {
        login: document.getElementById("loginForm"),
        register: document.getElementById("registerForm"),
        forgot: document.getElementById("forgotForm"),
        reset: document.getElementById("resetForm"),
        dashboard: document.getElementById("dashboard")
    };
    
    let resetEmail = "";
    
    function getUsers() {
        return JSON.parse(localStorage.getItem("demoUsers") || "[]");
    }
    
    function saveUsers(users) {
        localStorage.setItem("demoUsers", JSON.stringify(users));
    }
    
    function showMessage(text, type = "success") {
        const message = document.getElementById("message");
        message.textContent = text;
        message.className = "message " + type;
    }
    
    function showPage(page) {
        Object.values(forms).forEach(form => {
            form.classList.remove("active");
        });
    
        forms[page].classList.add("active");
    
        document.getElementById("tabs").style.display =
            page === "login" || page === "register" ? "flex" : "none";
    
        document.getElementById("loginTab").classList.toggle(
            "active", page === "login"
        );
    
        document.getElementById("registerTab").classList.toggle(
            "active", page === "register"
        );
    
        const titles = {
            login: "Welcome Back!",
            register: "Create Account",
            forgot: "Forgot Password",
            reset: "Reset Password",
            dashboard: "My Dashboard"
        };
    
        document.getElementById("pageTitle").textContent = titles[page];
        showMessage("");
    }
    
    function getCurrentUser() {
        const email = localStorage.getItem("demoSession");
        return getUsers().find(user => user.email === email);
    }
    
    // Registration
    forms.register.addEventListener("submit", function(event) {
        event.preventDefault();
    
        const name = document.getElementById("regName").value.trim();
        const email = document.getElementById("regEmail").value.trim().toLowerCase();
        const password = document.getElementById("regPassword").value;
        const confirm = document.getElementById("confirmPassword").value;
    
        if (password.length < 6) {
            return showMessage("Password must have at least 6 characters.", "error");
        }
    
        if (password !== confirm) {
            return showMessage("Passwords do not match.", "error");
        }
    
        const users = getUsers();
    
        if (users.some(user => user.email === email)) {
            return showMessage("This email is already registered.", "error");
        }
    
        users.push({ name, email, password });
        saveUsers(users);
    
        this.reset();
        showPage("login");
        document.getElementById("loginEmail").value = email;
        showMessage("Registration successful! Please log in.");
    });
    
    // Login
    forms.login.addEventListener("submit", function(event) {
        event.preventDefault();
    
        const email = document.getElementById("loginEmail").value.trim().toLowerCase();
        const password = document.getElementById("loginPassword").value;
    
        const user = getUsers().find(
            user => user.email === email && user.password === password
        );
    
        if (!user) {
            return showMessage("Incorrect email or password.", "error");
        }
    
        localStorage.setItem("demoSession", user.email);
        this.reset();
        openDashboard();
    });
    
    function openDashboard() {
        const user = getCurrentUser();
    
        if (!user) {
            logout();
            return;
        }
    
        showPage("dashboard");
        document.getElementById("welcomeText").textContent =
            "Welcome, " + user.name + "!";
    }
    
    // Forgot password
    forms.forgot.addEventListener("submit", function(event) {
        event.preventDefault();
    
        const email = document.getElementById("forgotEmail").value.trim().toLowerCase();
        const user = getUsers().find(user => user.email === email);
    
        if (!user) {
            return showMessage("No account found with this email.", "error");
        }
    
        resetEmail = email;
        this.reset();
        showPage("reset");
        showMessage("Demo reset: enter your new password.");
    });
    
    // Save new password
    forms.reset.addEventListener("submit", function(event) {
        event.preventDefault();
    
        const password = document.getElementById("newPassword").value;
        const confirm = document.getElementById("confirmNewPassword").value;
    
        if (password.length < 6) {
            return showMessage("Password must have at least 6 characters.", "error");
        }
    
        if (password !== confirm) {
            return showMessage("Passwords do not match.", "error");
        }
    
        const users = getUsers();
        const user = users.find(user => user.email === resetEmail);
    
        if (!user) {
            showPage("forgot");
            return showMessage("Account not found. Please try again.", "error");
        }
    
        user.password = password;
        saveUsers(users);
    
        this.reset();
        resetEmail = "";
        showPage("login");
        showMessage("Password changed! You can now log in.");
    });
    
    // Logout
    function logout() {
        localStorage.removeItem("demoSession");
        showPage("login");
        showMessage("You have been logged out.");
    }
    
    // Restore the demo session after refreshing the page
    if (localStorage.getItem("demoSession")) {
        openDashboard();
    } else {
        showPage("login");
    }
    </script>
    
</body>
</html>
