<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>combine tag</title>
</head>
<body bgcolor="yellow">
    <p align="left"><i><tt>Internet</tt> is a<br> global network</i></p>
    <hr>
    <p align="center"><b> <sub>Internet</sub>  is <sup> a global</sup> network</b></p>
    <hr>
    <p align="right"><u>Internet is a <del>global</del> network</u></p>
    <hr>
    <h4>Hello</h4>
    <h5>Hello</h5>
    <h6>Hello</h6>
</body>
</html>
