<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd</title>
</head>
<body>
    <h2>Check Even or Odd Number</h2>

    <script>
        var num = prompt("Enter a number:");

        if (num % 2 == 0) {
            document.write("The number is Even.");
        } else {
            document.write("The number is Odd.");
        }
    </script>
</body>
</html>
