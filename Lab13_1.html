    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bootstrap Grid Table</title>
    
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    
    <body>
    
    <div class="container mt-5">
        <h2 class="text-center mb-4">Student Details</h2>
    
        <!-- Header Row -->
        <div class="row bg-dark text-white fw-bold p-2">
            <div class="col">Roll No</div>
            <div class="col">Name</div>
            <div class="col">Course</div>
            <div class="col">Marks</div>
        </div>
    
        <!-- Row 1 -->
        <div class="row border p-2">
            <div class="col">7003</div>
            <div class="col">Vaishnavi</div>
            <div class="col">BCA</div>
            <div class="col">85</div>
        </div>
    
        <!-- Row 2 -->
        <div class="row border p-2">
            <div class="col">7029</div>
            <div class="col">Sharva</div>
            <div class="col">BCA</div>
            <div class="col">90</div>
        </div>
    
        <!-- Row 3 -->
        <div class="row border p-2">
            <div class="col">7049</div>
            <div class="col">Pihu</div>
            <div class="col">BCA</div>
            <div class="col">78</div>
        </div>
    </div>
    
    </body>
    </html>
