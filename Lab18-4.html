<!DOCTYPE html>
<lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Multiplication Table</h2>
</body>
    <script>
        var num = prompt("Enter a number:");

        document.write("<h3>Table of " + num + "</h3>");

        for (var i = 1; i <= 10; i++) {
            document.write(num + " x " + i + " = " +
                           (num * i) + "<br>");
        }
    </script>
</html>
