<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Progress Bar</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }

        .container {
            margin-top: 50px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h2 {
            margin-bottom: 30px;
        }

        .progress {
            height: 25px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2 class="text-center text-primary">Bootstrap Progress Bars</h2>

    <!-- 70% Progress -->
    <p>BWD</p>
    <div class="progress">
        <div class="progress-bar bg-success"
             role="progressbar"
             style="width: 70%;">
            70%
        </div>
    </div>

    <!-- 80% Progress -->
    <p>AOC</p>
    <div class="progress">
        <div class="progress-bar bg-info"
             role="progressbar"
             style="width: 80%;">
            80%
        </div>
    </div>

    <!-- 75% Progress -->
    <p>PP-1</p>
    <div class="progress">
        <div class="progress-bar bg-warning"
             role="progressbar"
             style="width: 75%;">
            75%
        </div>
    </div>

    <!-- 90% Progress -->
    <p>MATHS</p>
    <div class="progress">
        <div class="progress-bar bg-danger"
             role="progressbar"
             style="width: 90%;">
            90%
        </div>
    </div>

</div>

</body>
</html>
