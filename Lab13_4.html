<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagination Example</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">Student Information</h2>

        <p class="text-center">
            This page demonstrates a simple Bootstrap pagination control.
            Use the buttons below to navigate between pages.
        </p>

        <!-- Pagination -->
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">

                <li class="page-item disabled">
                    <a class="page-link" href="#">Previous</a>
                </li>

                <li class="page-item active">
                    <a class="page-link" href="page1.html">1</a>
                </li>

                <li class="page-item">
                    <a class="page-link" href="page2.html">2</a>
                </li>

                <li class="page-item">
                    <a class="page-link" href="page3.html">3</a>
                </li>

                <li class="page-item">
                    <a class="page-link" href="page4.html">4</a>
                </li>

                <li class="page-item">
                    <a class="page-link" href="page5.html">5</a>
                </li>

                <li class="page-item">
                    <a class="page-link" href="page2.html">Next</a>
                </li>

            </ul>
        </nav>

    </div>

</body>
</html>
