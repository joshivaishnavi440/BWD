<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image map</title>
</head>
<body>
    <h2>Circle Image Map</h2>

    <img src="nature image.jpg" width="400px" height="400px" usemap="#circlemap">

    <map name="circlemap">
        <area shape="circle" coords="337,300,44" href="https://th.bing.com/th/id/OIP.JPogPMSOOv8g9WJdtLUluAHaEe?w=279&h=180&c=7&r=0&o=7&pid=1.7&rm=3"
         target="_self">
    </map>

    <h2>Rectangle Image Map</h2>

    <img src="img2.webp" width="400px" height="400px" usemap="#rectmap">

    <map name="rectmap">
        <area shape="rect" coords="34,44,270,350" href="https://th.bing.com/th/id/OIP.1L1gN1K8uJP0Sdu6e_yvagHaEK?w=304&h=180&c=7&r=0&o=7&pid=1.7&rm=3"
         target="_self">
    </map>

    <h2>Polygon Image Map</h2>

    <img src="img4.webp" width="400px" height="400px" usemap="#polymap">

    <map name="polymap">
        <area shape="poly" coords="140,121,181,116" href="https://th.bing.com/th/id/OIP.SJeXVrt_qI6OWiivbAjFdwAAAA?w=239&h=180&c=7&r=0&o=7&pid=1.7&rm=3" 
        target="_blank">
    </map>
</body>
</html>
